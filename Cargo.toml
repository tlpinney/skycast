[package]
name = "weather"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Terminal weather widget: today, 7-day forecast, air quality, NWS alerts and radar"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
png = "0.18.1"
ratatui = "0.30"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
