[package]
name = "skycast"
version = "0.1.0-alpha.2"
edition = "2024"
# The oldest Rust that builds it (the uuid dependency needs 1.89; skycast itself 1.88).
rust-version = "1.89"
description = "Weather in your terminal: forecast, air quality, NWS alerts, Braille radar, sun and moon, and tides"
license = "MIT"
authors = ["Travis Pinney <travis.pinney@gmail.com>"]
repository = "https://github.com/tlpinney/skycast"
readme = "README.md"
keywords = ["weather", "terminal", "tui", "ratatui", "radar"]
categories = ["command-line-utilities"]
# Kept out of the package: CI and release tooling, and the README demo (docs/). assets/
# stays in: the map outlines are compiled into the binary.
exclude = [".github/", "deny.toml", "release/", "signing/", "tools/", "docs/"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
png = "0.18.1"
ratatui = "0.30"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
